name: AppMuseoIOS

options:
  bundleIdPrefix: es.appmuseo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  AppMuseoIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppMuseoIOS
        excludes:
          - Resources/Info.plist
      - path: ../public/models/mushroom.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/models/crystal.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/models/jellyfish.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/models/totem.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/models/cosmic-flower.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/models/empty-house.usdz
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-mushroom.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-crystal.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-jellyfish.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-totem.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-cosmic-flower.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/qr/qr-empty-house.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/markers/x-corner-marker-sheet.png
        buildPhase: resources
        group: Shared Resources
      - path: ../public/panoramas/paranal-360.jpg
        buildPhase: resources
        group: Shared Resources
    info:
      path: AppMuseoIOS/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.appmuseo.AppMuseoIOS
        PRODUCT_NAME: AppMuseoIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false

  AppMuseoIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AppMuseoIOSTests
    dependencies:
      - target: AppMuseoIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.appmuseo.AppMuseoIOSTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AppMuseoIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AppMuseoIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  AppMuseoIOS:
    build:
      targets:
        AppMuseoIOS: all
        AppMuseoIOSTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - AppMuseoIOSTests
    run:
      config: Debug
    archive:
      config: Release
