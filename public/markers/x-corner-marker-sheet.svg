<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="title desc">
  <title id="title">Patron imprimible con 4 X negras en las esquinas</title>
  <desc id="desc">Hoja A4 blanca con una X negra gruesa en cada esquina para probar el escaneo del modelo 3D.</desc>
  <rect width="210" height="297" fill="#ffffff"/>

  <g stroke="#000000" stroke-width="5.5" stroke-linecap="round">
    <line x1="18" y1="18" x2="42" y2="42"/>
    <line x1="42" y1="18" x2="18" y2="42"/>

    <line x1="168" y1="18" x2="192" y2="42"/>
    <line x1="192" y1="18" x2="168" y2="42"/>

    <line x1="18" y1="255" x2="42" y2="279"/>
    <line x1="42" y1="255" x2="18" y2="279"/>

    <line x1="168" y1="255" x2="192" y2="279"/>
    <line x1="192" y1="255" x2="168" y2="279"/>
  </g>
</svg>
