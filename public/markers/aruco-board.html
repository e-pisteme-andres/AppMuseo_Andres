<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantilla ArUco · App Museo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111111;
      --paper: #ffffff;
      --muted: #5a5a5a;
      --chrome: #ececec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--chrome);
    }

    .page-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .controls a,
    .controls button {
      border: 0;
      border-radius: 999px;
      background: #121212;
      color: #ffffff;
      padding: 12px 18px;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }

    .controls p {
      margin: 0;
      color: var(--muted);
      text-align: center;
      max-width: 62ch;
    }

    .sheet {
      width: min(100%, 840px);
      background: var(--paper);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.16);
      overflow: hidden;
    }

    .sheet img {
      display: block;
      width: 100%;
      height: auto;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
    }

    @media print {
      body { background: #ffffff; }
      .page-wrap { padding: 0; }
      .controls, .status { display: none; }
      .sheet {
        width: 210mm;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="controls">
      <button type="button" onclick="window.print()">Imprimir plantilla</button>
      <a href="./aruco-board.svg" download="aruco-board.svg">Descargar SVG</a>
      <p>Imprime esta hoja al 100%. Usa los cuatro marcadores, uno en cada esquina, y deja visible todo el papel al escanear.</p>
    </div>

    <section class="sheet" aria-label="Plantilla ArUco para App Museo">
      <img src="./aruco-board.svg" alt="Plantilla ArUco lista para imprimir con los marcadores 0, 1, 2 y 3 en las cuatro esquinas">
    </section>

    <p class="status">Plantilla lista. Los IDs usados por la app son 0, 1, 2 y 3.</p>
  </div>
</body>
</html>
