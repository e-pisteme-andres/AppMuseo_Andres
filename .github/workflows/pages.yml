name: Probar y publicar en GitHub Pages

on:
  push:
    branches: [main, dev, codex/ampliacion-360-grados]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Descargar dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site

      - name: Descargar ampliación 360
        uses: actions/checkout@v4
        with:
          ref: codex/ampliacion-360-grados
          path: panorama-360-site

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar y compilar main
        working-directory: main-site
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:assets
          pnpm test
          pnpm build

      - name: Probar y compilar dev
        working-directory: dev-site
        env:
          VITE_BASE_PATH: /AppMuseo_Andres/dev/
          QR_TARGET_URL: https://e-pisteme-andres.github.io/AppMuseo_Andres/dev/
          QR_FILE_NAME: qr-app-museo-dev.png
          VITE_QR_FILE_NAME: qr-app-museo-dev.png
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:assets
          pnpm validate:ios
          pnpm test
          pnpm build

      - name: Probar y compilar ampliación 360
        working-directory: panorama-360-site
        env:
          VITE_BASE_PATH: /AppMuseo_Andres/ampliacion-360-grados/
          QR_TARGET_URL: https://e-pisteme-andres.github.io/AppMuseo_Andres/ampliacion-360-grados/
          QR_FILE_NAME: qr-app-museo-360.png
          VITE_QR_FILE_NAME: qr-app-museo-360.png
        run: |
          pnpm install --frozen-lockfile
          pnpm download:panoramas
          pnpm generate:assets
          pnpm test
          pnpm build

      - name: Combinar main y vistas de prueba
        run: |
          mkdir -p site/dev site/ampliacion-360-grados
          cp -R main-site/dist/. site/
          cp -R dev-site/dist/. site/dev/
          cp -R panorama-360-site/dist/. site/ampliacion-360-grados/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
